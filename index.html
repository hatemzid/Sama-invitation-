<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>دعوة خطوبة سما ومحمد</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f0e9;
  font-family: Tahoma, Arial, sans-serif;
  color: #412d20;
}

.wrap {
  max-width: 650px;
  min-height: 100vh;
  margin: auto;
  background: #fffcf6;
}

.invitation {
  display: block;
  width: 100%;
  height: auto;
}

.venue {
  padding: 25px 20px;
  text-align: center;
  background: #fffaf0;
  border-bottom: 1px solid #e4ceb0;
}

.venue h2 {
  color: #977039;
  font-size: 23px;
}

.venue p {
  font-size: 16px;
}

.map {
  display: block;
  margin-top: 20px;
  padding: 17px;
  border-radius: 15px;
  background: linear-gradient(
    110deg,#99703b,#b48b53
  );
  color: white;
  text-decoration: none;
  font-weight: bold;
  font-size: 18px;
}

section {
  padding: 30px 20px 40px;
  text-align: center;
  background: linear-gradient(
    #fffaf0,#f9f1e2
  );
}

h1 {
  color: #8e632e;
  font-size: 30px;
  margin-bottom: 15px;
}

.sub {
  font-size: 16px;
  line-height: 1.9;
  margin-bottom: 25px;
}

.fields {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 12px;
  text-align: right;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

input, select {
  width: 100%;
  height: 50px;
  border: 1.5px solid #d5b985;
  border-radius: 12px;
  background: white;
  padding: 10px;
  font-size: 16px;
  font-family: inherit;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(
    110deg,#9f7035,#b38a53
  );
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.65;
}

.message {
  margin-top: 18px;
  font-weight: bold;
  line-height: 1.8;
  min-height: 25px;
}

.success {
  color: #208345;
}

.error {
  color: #ae2d30;
}

.waiting {
  color: #977039;
}

.info {
  font-size: 13px;
  margin-top: 18px;
  color: #756250;
}

@media (max-width: 365px) {
  .fields {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<main class="wrap">

<img
  class="invitation"
  src="./invitation.jpg"
  alt="دعوة خطوبة سما ومحمد"
/>

<div class="venue">

  <h2>📍 موقع حفل الخطوبة</h2>

  <p>
    قاعة سيليا – نادي الصيادلة بطلخا
  </p>

  <a
    class="map"
    href="https://maps.app.goo.gl/offCj6zJ79doP9Uk8?g_st=ic"
    target="_blank"
    rel="noopener noreferrer"
  >
    📍 افتح موقع القاعة على خرائط Google ↗
  </a>

</div>

<section>

  <h1>♡ تأكيد الحضور ♡</h1>

  <p class="sub">
    يسعدنا تشريفكم. يرجى كتابة الاسم الثنائي
    واختيار عدد الحاضرين.
  </p>

  <form id="rsvp">

    <div class="fields">

      <div>
        <label for="guestName">
          الاسم الثنائي
        </label>

        <input
          type="text"
          id="guestName"
          name="guestName"
          maxlength="100"
          autocomplete="name"
          placeholder="مثال: أحمد محمد"
          required
        >
      </div>

      <div>
        <label for="people">
          عدد الحاضرين
        </label>

        <select id="people" required>
          <option value="">
            اختر العدد
          </option>
          <option value="1">١</option>
          <option value="2">٢</option>
          <option value="3">٣</option>
          <option value="4">٤</option>
          <option value="5">٥</option>
        </select>
      </div>

    </div>

    <button type="submit" id="send">
      تأكيد الحضور
    </button>

    <p
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></p>

  </form>

  <p class="info">
    التسجيل مجاني، ويُحفظ في قائمة الحضور الخاصة بالمناسبة.
  </p>

  <p class="info">
    سما ♡ محمد — ٢٣ أكتوبر ٢٠٢٦
  </p>

</section>

</main>

<iframe
  id="receiver"
  name="rsvp_receiver"
  title="معالجة تسجيل الحضور"
  style="display:none"
></iframe>

<form
  id="relay"
  method="POST"
  target="rsvp_receiver"
  action="https://script.google.com/macros/s/AKfycbxPxiB86rbP9hLSUJK5jfIFV41fvuJ_2-pyf27-gsVX-0wAygAxNZJZ8WwmafowxWkW/exec"
  hidden
>
  <input type="hidden" name="name">
  <input type="hidden" name="count">
  <input type="hidden" name="requestId">
</form>
<script>
(function () {
  "use strict";

  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxPxiB86rbP9hLSUJK5jfIFV41fvuJ_2-pyf27-gsVX-0wAygAxNZJZ8WwmafowxWkW/exec";

  const form = document.getElementById("rsvp");
  const relay = document.getElementById("relay");
  const button = document.getElementById("send");
  const message = document.getElementById("message");

  let busy = false;

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  function setBusy(value) {
    busy = value;
    button.disabled = value;
    button.textContent = value
      ? "جارٍ تأكيد التسجيل..."
      : "تأكيد الحضور";
  }

  // استعلام للتحقق من أن التسجيل محفوظ
  function checkRegistration(requestId) {
    return new Promise(function (resolve, reject) {

      const callbackName = "rsvpCheckResult";
      const oldCallback = window[callbackName];

      const script = document.createElement("script");

      let finished = false;

      const timer = setTimeout(function () {
        finish(new Error("انتهت مهلة التحقق"));
      }, 10000);

      function finish(error, result) {
        if (finished) return;
        finished = true;

        clearTimeout(timer);
        script.remove();

        if (oldCallback === undefined) {
          delete window[callbackName];
        } else {
          window[callbackName] = oldCallback;
        }

        if (error) reject(error);
        else resolve(result);
      }

      window[callbackName] = function (data) {
        if (!data || data.requestId !== requestId) {
          return;
        }

        finish(null, data.found === true);
      };

      script.onerror = function () {
        finish(new Error("تعذر الاتصال بالخادم"));
      };

      script.src =
        SCRIPT_URL +
        "?requestId=" +
        encodeURIComponent(requestId) +
        "&t=" +
        Date.now();

      document.head.appendChild(script);
    });
  }

  function waitForRegistration(requestId) {
    return new Promise(function (resolve) {

      let attempts = 0;
      const maxAttempts = 6;

      async function check() {
        attempts++;

        try {
          const found = await checkRegistration(requestId);

          if (found) {
            resolve(true);
            return;
          }
        } catch (error) {
          console.warn("تعذر التحقق:", error);
        }

        if (attempts >= maxAttempts) {
          resolve(false);
          return;
        }

        setTimeout(check, 2000);
      }

      check();
    });
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    if (busy) return;

    const name = document
      .getElementById("guestName")
      .value.trim().replace(/\s+/g, " ");

    const count = document.getElementById("people").value;

    if (name.length < 5 || name.split(" ").length < 2) {
      showMessage(
        "يرجى كتابة الاسم الثنائي بشكل صحيح.",
        "error"
      );
      return;
    }

    if (!["1", "2", "3", "4", "5"].includes(count)) {
      showMessage(
        "يرجى اختيار عدد الحاضرين.",
        "error"
      );
      return;
    }

    const requestId =
      "r" +
      Date.now().toString(36) +
      Math.random().toString(36).slice(2);

    relay.elements.namedItem("name").value = name;
    relay.elements.namedItem("count").value = count;
    relay.elements.namedItem("requestId").value = requestId;

    setBusy(true);

    showMessage(
      "جارٍ إرسال بيانات الحضور والتحقق منها...",
      "waiting"
    );

    try {
      relay.submit();

      // الانتظار قليلًا للسماح بحفظ البيانات
      await new Promise(function (resolve) {
        setTimeout(resolve, 2000);
      });

      const saved = await waitForRegistration(requestId);

      if (saved) {
        showMessage(
          "تم تسجيل حضوركم بنجاح. شكرًا لكم! ♡",
          "success"
        );
        form.reset();
      } else {
        showMessage(
          "تعذر التأكد من نتيجة التسجيل. يرجى التواصل مع صاحب الدعوة قبل إعادة المحاولة.",
          "error"
        );
      }

    } catch (error) {
      showMessage(
        "تعذر التأكد من التسجيل. يرجى المحاولة لاحقًا بعد التحقق من قائمة الحضور.",
        "error"
      );
    } finally {
      setBusy(false);
    }
  });

})();
</script>

</body>
</html>
