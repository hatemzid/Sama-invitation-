<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6ecdc">
<title>دعوة خطوبة سما ومحمد | تأكيد الحضور</title>

<style>
:root {
  color-scheme:light;
  --gold:#977039;
  --border:#d5b985;
  --cream:#fffcf6;
}
* { box-sizing:border-box; }

body {
  margin:0;
  background:#f5f0e9;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  color:#412d20;
}
.wrap {
  max-width:650px;
  margin:0 auto;
  background:var(--cream);
  box-shadow:0 12px 45px #3d2b1b13;
  min-height:100vh;
}
img.invitation {
  display:block;
  width:100%;
  height:auto;
}
section {
  padding:25px 20px 34px;
  text-align:center;
  background:linear-gradient(#fffaf0,#f9f1e2);
}
h1 {
  font-size:clamp(25px,5vw,33px);
  color:#8e632e;
  margin:0 0 12px;
  font-weight:750;
}
.sub {
  font-size:15px;
  line-height:1.85;
  margin:0 auto 22px;
  max-width:390px;
}
.fields {
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(110px,1fr);
  gap:12px;
  text-align:right;
}
label {
  font-size:14px;
  font-weight:650;
  display:block;
  margin-bottom:8px;
}
input,select {
  width:100%;
  height:49px;
  border:1.5px solid var(--border);
  border-radius:12px;
  background:#fff;
  color:#35281f;
  padding:0 12px;
  font-size:16px;
  font-family:inherit;
  outline-color:var(--gold);
}
button {
  margin-top:22px;
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:linear-gradient(110deg,#9f7035,#b38a53);
  font:700 18px system-ui;
  color:white;
  cursor:pointer;
}
button:disabled {
  opacity:.65;
  cursor:wait;
}
.msg {
  min-height:26px;
  margin:14px 0 0;
  font-weight:600;
  font-size:15px;
}
.success { color:#227444; }
.error { color:#ae2d30; }
.notice { color:#73552d; }
.bottom {
  font-size:13px;
  margin-top:18px;
  color:#756250;
}
.info {
  font-size:13px;
  margin-top:14px;
  color:#725e45;
}
.extra {
  margin:10px 0 0;
  font-size:14px;
  line-height:1.8;
}
.fallback {
  display:none;
  margin-top:12px;
}
.fallback a { color:#79552a; }
footer {
  text-align:center;
  padding:12px 12px 26px;
  color:#82643e;
  font-size:13px;
}
.venue-link {
  padding:20px 20px 23px;
  background:#fffaf0;
  text-align:center;
  border-top:1px solid #e4ceb0;
  border-bottom:1px solid #e4ceb0;
}
.venue-title {
  margin:0 0 7px;
  color:#8e632e;
  font-weight:800;
  font-size:21px;
}
.venue-text {
  margin:0 0 14px;
  font-size:15px;
  line-height:1.7;
}
.venue-link a {
  display:block;
  margin:auto;
  max-width:450px;
  text-decoration:none;
  border:1px solid #bc9157;
  background:linear-gradient(115deg,#99703b,#b48b53);
  color:#fff;
  padding:15px 18px;
  border-radius:14px;
  font-weight:750;
  font-size:18px;
}
.venue-link a:focus-visible {
  outline:3px solid #775127;
  outline-offset:3px;
}
@media(max-width:365px) {
  .fields {grid-template-columns:1fr}
}
</style>
</head>

<body>
<main class="wrap">

<img
  class="invitation"
  src="./invitation.jpg"
  alt="دعوة حفل خطوبة سما ومحمد، الجمعة ٢٣ أكتوبر ٢٠٢٦ الساعة الرابعة مساءً، قاعة سيليا - نادي الصيادلة بطلخا"
/>

<div class="venue-link">
  <p class="venue-title">📍 موقع حفل الخطوبة</p>
  <p class="venue-text">
    قاعة سيليا – نادي الصيادلة بطلخا
  </p>
  <a
    href="https://maps.app.goo.gl/offCj6zJ79doP9Uk8?g_st=ic"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="فتح موقع القاعة على خرائط Google"
  >
    📍 افتح موقع القاعة على خرائط Google ↗
  </a>
</div>

<section>
  <h1>♡ تأكيد الحضور ♡</h1>
  <p class="sub">
    يسعدنا تشريفكم. يرجى كتابة الاسم الثنائي واختيار عدد الحاضرين.
  </p>

  <form id="rsvp">
    <div class="fields">
      <div>
        <label for="guestName">الاسم الثنائي</label>
        <input
          id="guestName"
          maxlength="100"
          required
          autocomplete="name"
          placeholder="مثال: أحمد محمد"
        >
      </div>
      <div>
        <label for="people">عدد الحاضرين</label>
        <select id="people" required>
          <option value="">اختر العدد</option>
          <option value="1">١</option>
          <option value="2">٢</option>
          <option value="3">٣</option>
          <option value="4">٤</option>
          <option value="5">٥</option>
        </select>
      </div>
    </div>

    <button type="button" id="send">
      تأكيد الحضور
    </button>

    <p
      id="message"
      role="status"
      aria-live="polite"
      class="msg"
    ></p>
  </form>

  <p class="info">
    التسجيل مجاني، ويُحفظ في قائمة الحضور الخاصة بالمناسبة.
  </p>
  <div class="bottom">
    سما ♡ محمد — ٢٣ أكتوبر ٢٠٢٦
  </div>
</section>
</main>

<iframe
  name="rsvp_receiver"
  id="receiver"
  style="width:0;height:0;border:0;position:absolute;left:-9999px"
  title="معالجة تسجيل الحضور"
></iframe>

<form
  method="POST"
  target="rsvp_receiver"
  id="relay"
  action="https://script.google.com/macros/s/AKfycbw67_PixGN56yqvHcQvSXe6YK35iimsugL2JFXtwuloZsz1GGk3gaAmJc0gvlI97xo/exec"
  hidden
>
  <input type="hidden" name="name">
  <input type="hidden" name="count">
  <input type="hidden" name="requestId">
</form>

<script>
(function() {
  'use strict';

  const URL =
    'https://script.google.com/macros/s/AKfycbw67_PixGN56yqvHcQvSXe6YK35iimsugL2JFXtwuloZsz1GGk3gaAmJc0gvlI97xo/exec';

  const button = document.getElementById('send');
  const form = document.getElementById('rsvp');
  const relay = document.getElementById('relay');
  const msg = document.getElementById('message');
  const guest = document.getElementById('guestName');
  const people = document.getElementById('people');

  let current = null;
  let polling = null;
  let attempts = 0;

  relay.action = URL;

  function show(text, kind) {
    msg.className = 'msg ' + kind;
    msg.textContent = text;
  }

  function setButton(text, disabled) {
    button.textContent = text;
    button.disabled = disabled;
  }

  function stopPolling() {
    if (polling) {
      clearTimeout(polling);
      polling = null;
    }
  }

  function verify() {
    if (!current) return;

    attempts++;

    const script = document.createElement('script');
    const tag = 'rsvpcheck-' + Date.now() + '-' + attempts;
    script.dataset.check = tag;

    script.src =
      URL +
      '?requestId=' +
      encodeURIComponent(current) +
      '&_=' +
      Date.now();

    script.onerror = function() {
      script.remove();
    };

    (document.head || document.body).appendChild(script);

    setTimeout(function() {
      script.remove();
    }, 5000);

    if (attempts < 9) {
      polling = setTimeout(verify, 2500);
    } else {
      polling = setTimeout(function() {
        if (!current) return;

        show(
          'لم يصل تأكيد الحفظ. احتفظ ببيانات التسجيل وتواصل مع صاحب الدعوة قبل إعادة المحاولة.',
          'notice'
        );

        setButton('بانتظار تأكيد التسجيل', true);
      }, 3000);
    }
  }

  window.rsvpCheckResult = function(data) {
    if (
      !current ||
      !data ||
      data.requestId !== current ||
      !data.found
    ) return;

    stopPolling();
    current = null;

    show(
      'تم تسجيل حضوركم بنجاح، شكرًا لكم!',
      'success'
    );

    setButton('تم تأكيد الحضور ✓', true);
    form.reset();
  };

  function submitRSVP() {
    if (current) {
      show(
        'طلبك قيد التحقق. لا تضغط مرة أخرى حتى لا يتكرر التسجيل.',
        'notice'
      );
      return;
    }

    const name = guest.value.trim().replace(/\s+/g, ' ');
    const count = people.value;

    if (
      name.length < 5 ||
      name.length > 100 ||
      name.split(' ').length < 2
    ) {
      show('اكتب الاسم الثنائي بصورة صحيحة.', 'error');
      return;
    }

    if (!/^[1-5]$/.test(count)) {
      show('اختر عدد الحاضرين من ١ إلى ٥.', 'error');
      return;
    }

    current =
      'r' +
      Date.now().toString(36) +
      Math.random().toString(36).slice(2, 12);

    relay.elements.namedItem('name').value = name;
    relay.elements.namedItem('count').value = count;
    relay.elements.namedItem('requestId').value = current;

    attempts = 0;

    setButton('جارٍ تسجيل الحضور…', true);
    show(
      'جارٍ إرسال البيانات والتحقق من الحفظ…',
      'notice'
    );

    try {
      relay.submit();
      polling = setTimeout(verify, 1700);
    } catch (err) {
      current = null;
      setButton('تأكيد الحضور', false);
      show(
        'فشل بدء الإرسال، تأكد من اتصال الإنترنت.',
        'error'
      );
    }
  }

  button.type = 'button';
  button.addEventListener('click', submitRSVP);

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    submitRSVP();
  });

  window.addEventListener('message', function(e) {
    if (
      !current ||
      !e.data ||
      e.data.type !== 'rsvp-result' ||
      e.data.requestId !== current
    ) return;

    if (
      e.origin !== 'https://script.google.com' &&
      !e.origin.endsWith('.googleusercontent.com')
    ) return;

    if (e.data.ok === true) {
      verify();
    }
  });
})();
</script>

</body>
</html>
